<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" fill="none">
  <rect width="800" height="350" fill="#0A0A0F"/>

  <!-- Title -->
  <text x="400" y="30" font-family="Inter, sans-serif" font-size="12" fill="#555560" text-anchor="middle" font-weight="500" letter-spacing="2">IMPACT PROPAGATION</text>

  <!-- Nodes -->
  <!-- Level 1: API Field -->
  <rect x="30" y="70" width="160" height="40" rx="6" fill="#14151A" stroke="#2A2A30" stroke-width="1"/>
  <circle cx="50" cy="90" r="4" fill="#EF4444"/>
  <text x="65" y="95" font-family="Inter, sans-serif" font-size="11" fill="white">User.status</text>

  <!-- Level 2: Mapping -->
  <rect x="240" y="70" width="180" height="40" rx="6" fill="#14151A" stroke="#2A2A30" stroke-width="1"/>
  <circle cx="260" cy="90" r="4" fill="#F97316"/>
  <text x="275" y="95" font-family="Inter, sans-serif" font-size="11" fill="white">status → accountEnabled</text>

  <!-- Level 3: Transform -->
  <rect x="470" y="70" width="180" height="40" rx="6" fill="#14151A" stroke="#2A2A30" stroke-width="1"/>
  <circle cx="490" cy="90" r="4" fill="#F97316"/>
  <text x="505" y="95" font-family="Inter, sans-serif" font-size="11" fill="white">Boolean → Enable/Disable</text>

  <!-- Level 4: Rule -->
  <rect x="470" y="140" width="180" height="40" rx="6" fill="#14151A" stroke="#2A2A30" stroke-width="1"/>
  <circle cx="490" cy="160" r="4" fill="#EAB308"/>
  <text x="505" y="165" font-family="Inter, sans-serif" font-size="11" fill="white">Disable on Inactive</text>

  <!-- Level 5: Decision -->
  <rect x="470" y="210" width="180" height="40" rx="6" fill="#14151A" stroke="#2A2A30" stroke-width="1"/>
  <circle cx="490" cy="230" r="4" fill="#EAB308"/>
  <text x="505" y="235" font-family="Inter, sans-serif" font-size="11" fill="white">Account Lifecycle Decision</text>

  <!-- Level 6a: Entitlement -->
  <rect x="300" y="280" width="180" height="40" rx="6" fill="#14151A" stroke="#EF4444" stroke-width="1.5"/>
  <circle cx="320" cy="300" r="4" fill="#EF4444"/>
  <text x="335" y="305" font-family="Inter, sans-serif" font-size="11" fill="#EF4444">AD Group: SF Users</text>

  <!-- Level 6b: Business Process -->
  <rect x="530" y="280" width="200" height="40" rx="6" fill="#14151A" stroke="#EF4444" stroke-width="1.5"/>
  <circle cx="550" cy="300" r="4" fill="#EF4444"/>
  <text x="565" y="305" font-family="Inter, sans-serif" font-size="11" fill="#EF4444">Employee Offboarding</text>

  <!-- Connections -->
  <line x1="190" y1="90" x2="240" y2="90" stroke="#333" stroke-width="1"/>
  <line x1="420" y1="90" x2="470" y2="90" stroke="#333" stroke-width="1"/>
  <line x1="560" y1="110" x2="560" y2="140" stroke="#333" stroke-width="1"/>
  <line x1="560" y1="180" x2="560" y2="210" stroke="#333" stroke-width="1"/>
  <line x1="520" y1="250" x2="390" y2="280" stroke="#333" stroke-width="1"/>
  <line x1="600" y1="250" x2="630" y2="280" stroke="#333" stroke-width="1"/>

  <!-- Relationship labels -->
  <text x="215" y="82" font-family="Inter, sans-serif" font-size="8" fill="#555560">MAPS_TO</text>
  <text x="445" y="82" font-family="Inter, sans-serif" font-size="8" fill="#555560">TRANSFORMS</text>
  <text x="565" y="130" font-family="Inter, sans-serif" font-size="8" fill="#555560">DRIVES</text>
  <text x="565" y="200" font-family="Inter, sans-serif" font-size="8" fill="#555560">EVALUATES</text>
  <text x="430" y="272" font-family="Inter, sans-serif" font-size="8" fill="#555560">CONTROLS</text>
  <text x="610" y="272" font-family="Inter, sans-serif" font-size="8" fill="#555560">AFFECTS</text>
</svg>
