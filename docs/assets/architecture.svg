<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <rect width="1200" height="320" fill="#0A0A0F"/>

  <!-- Stage 1: Monitor -->
  <rect x="40" y="60" width="190" height="200" rx="14" fill="#14151A" stroke="#2A2A30" stroke-width="1.5"/>
  <!-- Globe icon -->
  <circle cx="135" cy="110" r="22" fill="#1A1A2A" stroke="#444" stroke-width="1.5"/>
  <circle cx="135" cy="110" r="14" stroke="#888" stroke-width="1.2" fill="none"/>
  <ellipse cx="135" cy="110" rx="6" ry="14" stroke="#888" stroke-width="1" fill="none"/>
  <line x1="121" y1="104" x2="149" y2="104" stroke="#888" stroke-width="1"/>
  <line x1="121" y1="116" x2="149" y2="116" stroke="#888" stroke-width="1"/>
  <text x="135" y="155" font-family="Inter, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="600">Monitor</text>
  <text x="135" y="178" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">Track web sources</text>
  <text x="135" y="196" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">for content changes</text>
  <text x="135" y="240" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">API docs, changelogs,</text>
  <text x="135" y="254" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">schemas, release notes</text>

  <!-- Arrow 1 -->
  <line x1="230" y1="160" x2="268" y2="160" stroke="#444" stroke-width="2"/>
  <polygon points="268,155 278,160 268,165" fill="#666"/>

  <!-- Stage 2: Collect -->
  <rect x="280" y="60" width="190" height="200" rx="14" fill="#14151A" stroke="#2A2A30" stroke-width="1.5"/>
  <!-- Download icon -->
  <circle cx="375" cy="110" r="22" fill="#1A1A2A" stroke="#444" stroke-width="1.5"/>
  <line x1="375" y1="100" x2="375" y2="118" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <polyline points="369,113 375,119 381,113" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="365" y1="122" x2="385" y2="122" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <text x="375" y="155" font-family="Inter, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="600">Collect</text>
  <text x="375" y="178" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">Self-healing scrapers</text>
  <text x="375" y="196" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">extract structured data</text>
  <text x="375" y="240" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">Bright Data</text>
  <text x="375" y="254" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">Scraper Studio</text>

  <!-- Arrow 2 -->
  <line x1="470" y1="160" x2="508" y2="160" stroke="#444" stroke-width="2"/>
  <polygon points="508,155 518,160 508,165" fill="#666"/>

  <!-- Stage 3: Analyze (center, slightly larger) -->
  <rect x="520" y="50" width="200" height="220" rx="14" fill="#14151A" stroke="#555" stroke-width="2"/>
  <!-- Brain/pulse icon -->
  <circle cx="620" cy="105" r="24" fill="#1A1A2A" stroke="#666" stroke-width="1.5"/>
  <path d="M604 105 L610 105 L613 95 L617 115 L621 92 L625 115 L628 100 L632 105 L636 105" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="153" font-family="Inter, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="600">Analyze</text>
  <text x="620" y="176" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">Detect semantic changes</text>
  <text x="620" y="194" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">Classify into 17 shift types</text>
  <text x="620" y="212" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">Score severity</text>
  <text x="620" y="250" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">Gemini 2.5 Flash</text>

  <!-- Arrow 3 -->
  <line x1="720" y1="160" x2="758" y2="160" stroke="#444" stroke-width="2"/>
  <polygon points="758,155 768,160 758,165" fill="#666"/>

  <!-- Stage 4: Propagate -->
  <rect x="770" y="60" width="190" height="200" rx="14" fill="#14151A" stroke="#2A2A30" stroke-width="1.5"/>
  <!-- Graph/network icon -->
  <circle cx="865" cy="110" r="22" fill="#1A1A2A" stroke="#444" stroke-width="1.5"/>
  <circle cx="857" cy="103" r="3" fill="#888"/>
  <circle cx="873" cy="103" r="3" fill="#888"/>
  <circle cx="865" cy="119" r="3" fill="#888"/>
  <line x1="857" y1="103" x2="873" y2="103" stroke="#888" stroke-width="1.2"/>
  <line x1="857" y1="103" x2="865" y2="119" stroke="#888" stroke-width="1.2"/>
  <line x1="873" y1="103" x2="865" y2="119" stroke="#888" stroke-width="1.2"/>
  <text x="865" y="155" font-family="Inter, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="600">Propagate</text>
  <text x="865" y="178" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">Trace impact through</text>
  <text x="865" y="196" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">dependency graph</text>
  <text x="865" y="240" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">Neo4j typed</text>
  <text x="865" y="254" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">entity graph</text>

  <!-- Arrow 4 -->
  <line x1="960" y1="160" x2="998" y2="160" stroke="#444" stroke-width="2"/>
  <polygon points="998,155 1008,160 998,165" fill="#666"/>

  <!-- Stage 5: Act -->
  <rect x="1010" y="60" width="160" height="200" rx="14" fill="#14151A" stroke="#2A2A30" stroke-width="1.5"/>
  <!-- Bell icon -->
  <circle cx="1090" cy="110" r="22" fill="#1A1A2A" stroke="#444" stroke-width="1.5"/>
  <path d="M1090 99 C1084 99 1080 103 1080 109 L1080 115 L1078 117 L1102 117 L1100 115 L1100 109 C1100 103 1096 99 1090 99 Z" stroke="#888" stroke-width="1.5" fill="none"/>
  <line x1="1087" y1="120" x2="1093" y2="120" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <text x="1090" y="155" font-family="Inter, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="600">Act</text>
  <text x="1090" y="178" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">Generate remediation</text>
  <text x="1090" y="196" font-family="Inter, sans-serif" font-size="11" fill="#888890" text-anchor="middle">Alert the right teams</text>
  <text x="1090" y="240" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">Slack, Telegram,</text>
  <text x="1090" y="254" font-family="Inter, sans-serif" font-size="10" fill="#555" text-anchor="middle">Webhook, Jira</text>
</svg>
